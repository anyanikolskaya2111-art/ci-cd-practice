name: CI/CD Pipeline

on:
  push:
    branches: [ main, development, release ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        pytest test_calculator.py -v
  
  docs:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Generate documentation
      run: |
        mkdir -p docs
        echo "# Calculator API Documentation" > docs/index.md
        echo "" >> docs/index.md
        echo "Generated on: $(date)" >> docs/index.md
        echo "" >> docs/index.md
        echo "## Available Functions" >> docs/index.md
        echo "" >> docs/index.md
        echo "| Function | Description |" >> docs/index.md
        echo "|----------|-------------|" >> docs/index.md
        echo "| add(a,b) | Returns a + b |" >> docs/index.md
        echo "| subtract(a,b) | Returns a - b |" >> docs/index.md
        echo "| multiply(a,b) | Returns a * b |" >> docs/index.md
        echo "| divide(a,b) | Returns a / b or None if b=0 |" >> docs/index.md
    
    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/
